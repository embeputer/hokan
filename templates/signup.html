{{define "title"}}Sign up — Hokan{{end}}
{{define "content"}}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="lede">First user becomes the operator of this instance.</p>
    <form class="stack" method="post" action="/signup">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
      <button type="submit">Sign up</button>
    </form>
    <p class="muted" style="margin-top:16px">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{{end}}
