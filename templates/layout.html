<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Hokan{{end}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
<header class="nav">
  <a class="brand" href="/"><span class="brand-mark"></span><span class="brand-name">Hokan</span></a>
  <nav class="nav-links">
    {{if .User}}
      <a href="/">Repos</a>
      <a href="/orgs">Orgs</a>
      <details class="menu">
        <summary class="nav-user">
          <img class="avatar avatar-sm" src="{{avatarURL .User.Username}}" alt="" width="24" height="24">
          {{.User.Username}}
        </summary>
        <div class="menu-list">
          <a href="/{{.User.Username}}">Profile</a>
          <a href="/settings/profile">Settings</a>
          <a href="/settings/keys">SSH keys</a>
          <a href="/settings/tokens">Tokens</a>
          <a href="/logout">Log out</a>
        </div>
      </details>
    {{else}}
      <a href="/#explore">Explore</a>
      <a href="/login">Log in</a>
      {{if .AllowSignup}}<a class="btn" href="/signup">Sign up</a>{{end}}
    {{end}}
  </nav>
</header>
{{block "main" .}}
<main class="wrap">
  {{if .Flash}}<div class="flash {{.FlashType}}">{{.Flash}}</div>{{end}}
  {{block "content" .}}{{end}}
</main>
{{end}}
</body>
</html>
